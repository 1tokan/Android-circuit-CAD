name: Android device test

# Android エミュレータで APK を実際に動かす試験（WebView・戻るボタン・ファイル書き出し・テストA〜Eの通し）
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-device-test
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APK (WebView debugging enabled)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          WEBVIEW_DEBUG: '1'
        run: bash android-build/build.sh
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/device/run.sh dist/pocket-eda-$(node -p "require('./package.json').version")-devtest.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-api${{ matrix.api-level }}
          path: tests/device/out
      # 結果を device-test-api<番号> ブランチにも置く（成果物のダウンロードが使えない環境から確認するため）
      - name: Publish results
        if: always()
        run: |
          mkdir -p pub && cp -r tests/device/out/. pub/ 2>/dev/null || true
          printf 'commit: %s\nrun: %s\n' "${{ github.sha }}" "${{ github.run_id }}" > pub/RUN.txt
          cd pub
          git init -q -b device-test-api${{ matrix.api-level }}
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -q -m "device test api${{ matrix.api-level }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" device-test-api${{ matrix.api-level }}
