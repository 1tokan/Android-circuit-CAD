name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'tests/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash android-build/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-eda-apk
          path: dist/*.apk
      # 最新の APK を apk ブランチに置く（スマホのブラウザから直接ダウンロードできるように）
      - name: Publish to apk branch
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir out
          cp dist/*.apk out/pocket-eda.apk
          printf '# Pocket EDA APK\n\n- version: %s\n- build: %s\n- commit: %s\n\n[pocket-eda.apk をダウンロード](https://github.com/%s/raw/apk/pocket-eda.apk)\n' \
            "$VERSION" "${{ github.run_number }}" "${{ github.sha }}" "${{ github.repository }}" > out/README.md
          cd out
          git init -q -b apk
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -q -m "APK ${VERSION} (build ${{ github.run_number }}, ${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
